# Verificado com docker compose em 2026-11-27. Tokens: definir no ambiente (sem valores predefinidos).
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ARBITRATIONLAB_DATABASE_URL: sqlite:////app/data/arbitrationlab.db
      ARBITRATIONLAB_CLIENT_TOKEN: ${ARBITRATIONLAB_CLIENT_TOKEN:?defina o token de cliente}
      ARBITRATIONLAB_REVIEWER_TOKEN: ${ARBITRATIONLAB_REVIEWER_TOKEN:?defina o token de revisor}
    volumes:
      - arbitrationlab-data:/app/data

volumes:
  arbitrationlab-data:
