[build-system]
requires = ["setuptools==84.2.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrationlab"
version = "0.1.0"
description = "Arbitragem calibrada de extracções LLM com evidência, abstenção e revisão humana"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "sqlalchemy==2.1.9",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "jsonschema==4.26.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Dados sinteticos reprodutiveis: o gerador usa random de proposito, nao criptografia.
"src/arbitrationlab/dataset/generator.py" = ["S311"]
