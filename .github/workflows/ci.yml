name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ruff (lint e formatacao)
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest
      - name: Experiencia em mock (sem custos, saida temporaria)
        run: python -m arbitrationlab.experiments.run --mode mock --out "${RUNNER_TEMP}/exp"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
